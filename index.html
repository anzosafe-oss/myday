  share:'<circle cx="6" cy="12" r="2"/><circle cx="18" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="m8 11 8-5m-8 7 8 5"/>',
  pin:'<path d="m15 4 5 5-4 2-1 5-3-3-6 6m6-6-4-4 5-1 2-4z"/>'

const icon = name => '<svg viewBox="0 0 24 24" aria-hidden="true">' + paths[name] + '</svg>';
const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));

const types = {note:'Notiță',task:'Sarcină',event:'Eveniment'};
const categories = {work:'Serviciu',personal:'Personal',idei:'Idei'};
const colors = {coral:'Coral',lime:'Lime',yellow:'Galben'};
const priorities = {normal:'Normală',high:'Ridicată',low:'Scăzută'};
const repeats = {none:'Fără repetare',daily:'Zilnic',weekly:'Săptămânal',monthly:'Lunar'};

const seed = () => [
  make('task','Revizuiește planul de proiect','Verifică reperele înainte de ședință.',{date:dateAt(0),time:'16:00',priority:'high',sub:[{title:'Verifică termenele',done:true},{title:'Trimite observațiile',done:false}]}),
  make('task','Pregătește lista pentru weekend','Cumpărături și echipament pentru traseu.',{date:dateAt(0)}),
  make('task','Confirmă rezervarea','Verifică mesajul de la pensiune.',{date:dateAt(-1)}),
  make('task','Trimite notițele de ședință','Actualizează documentul echipei.',{date:dateAt(0),done:true}),
  make('event','Ședință de coordonare','Reperele săptămânii și punctele deschise.',{date:dateAt(1),start:'10:00',end:'10:45',reminders:{15:{enabled:true}}}),
  make('event','Ieșire pe traseu','Ne întâlnim la intrarea în parc.',{date:dateAt(3),start:'09:00',end:'12:00'}),
  make('note','Idei pentru weekend','Traseu scurt dimineața, cafea în oraș după. Verifică prognoza înainte de plecare.',{pinned:true}),
  make('note','Repere de proiect','Verificare desene, centralizare observații și confirmarea livrabilelor cu echipa.',{category:'work',color:'lime'}),
  make('note','De încercat','Un traseu nou de alergare și o rețetă pentru grătar.',{category:'idei',color:'yellow'})
];
const storage = {
  read() { try {return JSON.parse(localStorage.getItem('myday.v1'));} catch {return null;} },
  write(value) { try {localStorage.setItem('myday.v1',JSON.stringify(value));} catch {} }
};
let data = storage.read() ?? {items:seed(),theme:'dark',tab:'home',notifications:true,name:'AnZo'};
let page = tabs[data.tab] ? data.tab : 'home';
let filter='all', taskFilter='all', screen='', chosen='', draft=null, confirmDelete=false, overdueOnly=false;
let selected=today(), scope='month', toastTimer, lastDeleted;
const media = matchMedia('(prefers-color-scheme: dark)');
const app = document.querySelector('#app');
const el = id => document.getElementById(id);
const brandIcon = el('brand-icon').content;
const items = type => data.items.filter(item=>item.type===type);
const get = id => data.items.find(item=>item.id===id);
const save = () => storage.write(data);
const applyTheme = () => {document.documentElement.dataset.theme=data.theme==='auto'?(media.matches?'dark':'light'):data.theme;};
media.addEventListener('change',applyTheme);
const notice = (text, undo=false) => {
  clearTimeout(toastTimer);
  el('toast').innerHTML=esc(text)+(undo?' '+btn('undo-delete','Anulează'):'');
  toastTimer=setTimeout(()=>{el('toast').textContent='';lastDeleted=null;},undo?6500:2400);
};
const btn = (action,text,cls='',id='') => '<button type="button" class="'+cls+'" data-action="'+action+'" data-id="'+esc(id)+'">'+text+'</button>';
const round = (action,name,label,id='',cls='') => '<button type="button" class="round '+cls+'" aria-label="'+esc(label)+'" title="'+esc(label)+'" data-action="'+action+'" data-id="'+esc(id)+'">'+icon(name)+'</button>';
const empty = text => '<div class="empty muted">'+text+'</div>';
const head = (title, sub='') => '<div class="page-top"><div><h1>'+title+'</h1>'+(sub?'<p class="muted">'+sub+'</p>':'')+'</div></div>';
const chips = (action, options, current) => '<div class="pills">'+Object.entries(options).map(([value,label])=>'<button type="button" class="'+(value===current?'active':'')+'" aria-pressed="'+(value===current)+'" data-action="'+action+'" data-id="'+value+'">'+label+'</button>').join('')+'</div>';
const overdue = item => !item.done && item.date && item.date<today();
const tag = item => item.people.length ? '<span class="chip tiny">'+icon('share')+' Partajat</span>' : '';
const navButton = (tab,mobile) => '<button type="button" data-action="nav" data-id="'+tab+'" '+(page===tab?'aria-current="page"':'')+'>'+(mobile?icon(tab):'')+tabs[tab]+'</button>';
function dueReminder(now = Date.now()){
  if(!data.notifications)return null;
  for(const item of data.items){
    if(item.type==='note'||item.done||!item.date)continue;
    const time=item.type==='event'?item.start:item.time;
    if(!time)continue;
    for(const [key,reminder] of Object.entries(item.reminders)){
      if(!reminder.enabled)continue;
      const startDate=new Date(now);
      for(let days=-1;days<=8;days++){
        const date=dateKey(shifted(startDate,days));
        if(item.type==='event'?!occurs(item,date):item.date!==date)continue;
        const original=new Date(date+'T'+time).getTime()-Number(key)*60000;
        const target=reminder.occurrence===date&&reminder.snooze?reminder.snooze:original;
        if(reminder.dismissed===date||target>now||now-target>3600000)continue;
        return {item,key,date};
      }
    }
  }
  return null;
}
function renderReminder(){
  const host=el('reminder-banner'), due=dueReminder();
  const html=due?'<div class="reminder-banner split"><strong>Reminder în aplicație · '+esc(due.item.title)+'</strong><div class="actions">'+btn('banner-snooze','Amână 10 min')+btn('banner-dismiss','Închide')+'</div></div>':'';
  if(host.innerHTML!==html)host.innerHTML=html;
}
function renderChrome(){
  const calendarButton = '<button class="round calendar-link" type="button" data-action="nav" data-id="event" aria-label="Calendar" title="Calendar" '+(page==='event'?'aria-current="page"':'')+'>'+icon('event')+'</button>';
  el('header').innerHTML='<div class="bar"><button type="button" class="brand" data-action="nav" data-id="home"><img class="logo" src="'+brandIcon+'" width="36" height="36" alt=""><span>My<span class="brand-day">Day</span></span></button><nav class="nav desktop" aria-label="Navigare principală">'+Object.keys(tabs).filter(tab=>tab!=='event').map(tab=>navButton(tab,false)).join('')+'</nav><div class="actions">'+calendarButton+btn('add',icon('plus')+' Adaugă','accent add desktop-add')+'</div></div>';
  el('mobile').innerHTML='<nav class="nav mobile" aria-label="Navigare mobilă">'+['home','note','add','task','settings'].map(tab=>tab==='add'?round('add','plus','Adaugă','','add'):navButton(tab,true)).join('')+'</nav>';
}
function line(item, occurrence=item.date){
  const isTask=item.type==='task';
  const meta=isTask?[item.done?'Finalizată':overdue(item)?'Restantă':fmt(item.date),item.priority==='high'?'Prioritate ridicată':'',item.sub.length?item.sub.filter(s=>s.done).length+'/'+item.sub.length+' pași':''].filter(Boolean).join(' · '):[fmt(occurrence),item.start,item.end?'– '+item.end:''].filter(Boolean).join(' ');
  const tone=isTask?(item.done?'lime':overdue(item)||item.priority==='high'?'coral':''):'yellow';
  return '<div class="lineitem '+tone+(item.done?' done':'')+'">'+btn('detail','<strong>'+esc(item.title)+'</strong><small>'+esc(meta)+(item.people.length?' · Partajat':'')+'</small>','open',item.id)+(isTask?'<button type="button" class="check" data-action="toggle" data-id="'+item.id+'" aria-label="'+(item.done?'Debifează':'Finalizează')+' '+esc(item.title)+'" aria-pressed="'+!!item.done+'">'+(item.done?icon('check'):'')+'</button>':round('detail','arrow','Detalii',item.id))+'</div>';
}
const stack = (entries,message) => entries.length?'<div class="stack">'+entries.join('')+'</div>':empty(message);
const section = (title,content,action='') => '<section><div class="section-head"><h2>'+title+'</h2>'+action+'</div>'+content+'</section>';
function card(item){
  return '<article class="card cover '+item.color+'"><div class="cardtop"><div class="tags"><span class="tiny">'+fmt(item.created)+'</span>'+(item.pinned?'<span title="Fixată">'+icon('pin')+'</span>':'')+tag(item)+'</div>'+round('edit','edit','Editează',item.id)+'</div><h3>'+esc(item.title)+'</h3><p class="excerpt">'+esc(item.body)+'</p><div class="split"><span class="chip tiny">#'+item.category+'</span>'+round('detail','arrow','Deschide '+item.title,item.id,'jump')+'</div></article>';
}
function occurs(item,key){
  if (!item.date || key<item.date) return false;
  if (key===item.date) return true;
  const base=parse(item.date), day=parse(key);
  return item.repeat==='daily' || (item.repeat==='weekly' && base.getDay()===day.getDay()) || (item.repeat==='monthly' && base.getDate()===day.getDate());
}
function upcoming(){
  return items('event').map(item=>{
    const remaining=(date)=>date>today()||(date===today()&&new Date(date+'T'+item.end).getTime()>=Date.now());
    let date=remaining(item.date)?item.date:'';
    for(let offset=0;!date && offset<32;offset++){
      const candidate=dateAt(offset);
      if(remaining(candidate)&&occurs(item,candidate))date=candidate;
    }
    return {item,date};
  }).filter(e=>e.date).sort((a,b)=>(a.date+a.item.start).localeCompare(b.date+b.item.start));

function home(){

    ['Sarcini deschise',pending.length,'De finalizat','lime','task','nav','task'],
    ['Programări',events.length,'Evenimente viitoare','yellow','event','nav','event'],
    ['Restanțe',late.length,'Termen depășit','coral','alert','overdue','']
  ];
  return '<div class="page-top"><div><div class="date">'+fmt(today(),{weekday:'long',day:'numeric',month:'long'})+'</div><h1>Ziua mea</h1><p class="muted">Bună, '+esc(data.name)+'!</p></div></div><div class="overview">'+summaries.map(([label,n,caption,tone,symbol,action,id])=>'<article class="card '+tone+'"><div class="cardtop"><strong>'+label+'</strong>'+icon(symbol)+'</div><div class="big">'+String(n).padStart(2,'0')+'</div><div class="split"><span class="tiny">'+caption+'</span>'+round(action,'arrow',label,id,'jump')+'</div></article>').join('')+'</div><div class="dashboard">'+section('De făcut',stack([...late,...pending.filter(t=>!overdue(t))].slice(0,4).map(t=>line(t)),'Ai finalizat toate sarcinile.'),btn('nav','Vezi toate','', 'task'))+section('În calendar',stack(events.slice(0,3).map(e=>line(e.item,e.date)),'Nu ai programări viitoare.'),btn('nav','Calendar','','event'))+'</div>'+(notes.length?'<div style="margin-top:26px">'+section('Notițe fixate','<div class="notegrid">'+notes.map(card).join('')+'</div>',btn('nav','Vezi notițele','','note'))+'</div>':'');
}
function notesPage(){
  const notes=items('note').filter(n=>filter==='all'||n.category===filter).sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned)||b.created.localeCompare(a.created));
  return head('Notițele mele')+chips('filter',{all:'#all',work:'#work',personal:'#personal',idei:'#idei'},filter)+(notes.length?'<div class="notegrid">'+notes.map(card).join('')+'</div>':empty('Nu ai notițe în această categorie.'));
}
function tasksPage(){
  const tasks=items('task').filter(t=>overdueOnly?overdue(t):taskFilter==='all'||(taskFilter==='done'?t.done:!t.done)).sort((a,b)=>Number(!!a.done)-Number(!!b.done)||Number(!!overdue(b))-Number(!!overdue(a))||(a.date||'z').localeCompare(b.date||'z'));
  return head('Sarcinile mele')+chips('task-filter',{all:'Toate',open:'De făcut',done:'Finalizate',late:'Restante'},overdueOnly?'late':taskFilter)+stack(tasks.map(t=>line(t)),'Nu ai sarcini în această listă.');

  const monday = d => shifted(d,-((d.getDay()+6)%7));
  const from = scope==='month'?monday(monthStart):monday(day);
  const count = scope==='month'?7*Math.ceil(((monthStart.getDay()+6)%7+new Date(day.getFullYear(),day.getMonth()+1,0).getDate())/7):7;
  const events=items('event');
  const heading=scope==='month'?fmt(selected,{month:'long',year:'numeric'}):scope==='week'?fmt(dateKey(from))+' – '+fmt(dateKey(shifted(from,6))):fmt(selected,{day:'numeric',month:'long'});
  const dates=Array.from({length:count},(_,i)=>shifted(from,i));
  const schedule=events.filter(event=>occurs(event,selected)).sort((a,b)=>a.start.localeCompare(b.start));
  const grid=scope==='day'?'':'<div class="calendar">'+['Lu','Ma','Mi','Jo','Vi','Sâ','Du'].map(d=>'<div class="dayhead">'+d+'</div>').join('')+dates.map(d=>{
    const key=dateKey(d), has=events.some(event=>occurs(event,key));
    return '<button type="button" class="'+(key===selected?'selected ':'')+(scope==='month'&&d.getMonth()!==day.getMonth()?'out':'')+'" aria-pressed="'+(key===selected)+'" aria-label="'+fmt(key,{day:'numeric',month:'long',year:'numeric'})+(has?', cu evenimente':'')+'" data-action="day" data-id="'+key+'">'+d.getDate()+'<span class="calmark">'+(has?'<i class="dot"></i>':'')+'</span></button>';
  }).join('')+'</div>';
  return head('Calendar')+chips('scope',{month:'Lună',week:'Săptămână',day:'Zi'},scope)+'<div class="section-head calendar-head"><h2>'+heading+'</h2><div class="actions">'+round('shift','back','Perioada anterioară','-1')+round('shift','next','Perioada următoare','1')+btn('day','Azi','',today())+'</div></div>'+grid+section(fmt(selected,{weekday:'long',day:'numeric',month:'long'}),stack(schedule.map(e=>line(e,selected)),'Nicio programare în această zi.'),round('add-event','plus','Adaugă eveniment'));
}
const options = (values,current) => Object.entries(values).map(([key,label])=>'<option value="'+key+'" '+(key===current?'selected':'')+'>'+label+'</option>').join('');
function settings(){
  const shared=data.items.filter(i=>i.people.length);
  return head('Setări')+'<div class="formpage"><div id="myday-cloud"></div><section class="panel"><div class="section-head"><h2>Aspect</h2>'+round('theme-cycle',document.documentElement.dataset.theme==='dark'?'sun':'moon',document.documentElement.dataset.theme==='dark'?'Activează tema Light':'Activează tema Dark')+'</div>'+chips('theme',{dark:'Dark',light:'Light',auto:'Auto'},data.theme)+'</section><section class="panel"><h2>Notificări</h2><label class="inline"><input type="checkbox" id="notifications" '+(data.notifications?'checked':'')+'> Remindere în aplicație</label><p class="muted">Preferință locală pentru prototip.</p></section><section class="panel"><h2>Cont demonstrativ</h2><form id="profile" class="row"><label style="flex:1">Nume afișat<input required name="name" maxlength="35" value="'+esc(data.name)+'"></label><button class="accent" style="align-self:end">Salvează</button></form></section><section class="panel"><h2>Partajări</h2>'+stack(shared.map(i=>'<div class="lineitem">'+btn('share','<strong>'+esc(i.title)+'</strong><small>'+i.people.length+' cu acces demonstrativ</small>','open',i.id)+round('share','share','Gestionează accesul',i.id)+'</div>'),'Nu ai înregistrări partajate.')+'</section><footer>MyDay v0.1.0</footer></div>';
}
const field = (label,name,value,type='text',attrs='') => '<label>'+label+'<input type="'+type+'" name="'+name+'" value="'+esc(value)+'" '+attrs+'></label>';
const select = (label,name,values,current) => '<label>'+label+'<select name="'+name+'">'+options(values,current)+'</select></label>';
const box = (label,name,checked) => '<label class="inline"><input type="checkbox" name="'+name+'" '+(checked?'checked':'')+'>'+label+'</label>';
function formPage(){
  const item=draft, original=get(chosen);
  const title=original?'Editează înregistrarea':'Adaugă';
  const isNote=item.type==='note', isEvent=item.type==='event';
  const typePicker = !original||original.type==='note'?chips('type',types,item.type):'';
  const details=isNote?'<div class="fields">'+select('Categorie','category',categories,item.category)+select('Culoare','color',colors,item.color)+'</div>':
    '<div class="fields">'+field(isEvent?'Dată':'Termen','date',item.date,'date',isEvent?'required':'')+(isEvent?field('Început','start',item.start,'time','required')+field('Sfârșit','end',item.end,'time','required'):field('Ora termenului','time',item.time,'time')+select('Prioritate','priority',priorities,item.priority))+select('Repetare','repeat',repeats,item.repeat)+'</div>'+
    (isEvent?'':'<label>Pași (câte unul pe rând)<textarea name="sub">'+esc(item.sub.map(s=>s.title).join('\n'))+'</textarea></label>')+
    '<details '+(Object.keys(item.reminders).length?'open':'')+'><summary>Remindere</summary>'+Object.entries(offsets).map(([value,label])=>box(label,'reminder-'+value,item.reminders[value]?.enabled)).join('')+'</details>';
  return '<div class="formpage">'+round('back','back','Înapoi')+'<h1>'+title+'</h1>'+typePicker+'<form id="record" class="formgrid">'+field('Titlu','title',item.title,'text','required maxlength="120"')+'<label>'+(isNote?'Conținut':'Descriere opțională')+'<textarea name="body" maxlength="6000">'+esc(item.body)+'</textarea></label>'+details+'<div class="actions form-actions"><button class="accent">Salvează</button>'+btn('back','Anulează')+'</div><p id="form-error" class="danger" role="alert"></p></form></div>';
}
function detailPage(item){
  const isNote=item.type==='note';
  const meta=isNote?[fmt(item.created),'#'+item.category]:[fmt(item.date),item.type==='event'?item.start+' – '+item.end:item.time,item.type==='task'?priorities[item.priority]:'',item.repeat!=='none'?repeats[item.repeat]:''];
  const reminders=Object.entries(item.reminders);
  const reminderPanel=isNote?'':'<div class="panel"><h2>Remindere</h2>'+stack(reminders.map(([key,value])=>'<div class="lineitem"><div>'+esc(offsets[key])+'<br><small class="muted">'+(value.enabled?(value.snooze>Date.now()?'Amânat până la '+new Date(value.snooze).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'}):'Activ'):'Dezactivat')+'</small></div><div class="actions">'+btn('reminder-toggle',value.enabled?'Dezactivează':'Activează','',key)+(value.enabled?btn('snooze','Amână 10 min','',''+key):'')+'</div></div>'),'Nu ai configurat remindere.')+'</div>';
  const subtasks=item.sub.length&&item.type==='task'?'<div class="panel"><h2>Pași</h2>'+item.sub.map((s,i)=>'<label class="inline"><input type="checkbox" data-sub="'+i+'" '+(s.done?'checked':'')+'>'+esc(s.title)+'</label>').join('')+'</div>':'';
  return '<div class="detail"><div class="split">'+round('back','back','Înapoi')+'<div class="actions">'+round('edit','edit','Editează',item.id,'accent')+round('share','share','Partajează',item.id)+'</div></div><div class="date" style="margin-top:18px">'+types[item.type]+' · '+meta.filter(Boolean).map(esc).join(' · ')+'</div><h1>'+esc(item.title)+'</h1><article class="card '+(isNote?item.color:item.type==='event'?'yellow':'lime')+'" style="margin:18px 0"><div class="tags">'+tag(item)+(isNote&&item.pinned?'<span class="chip tiny">Fixată</span>':'')+'</div><p class="detail-content">'+esc(item.body||'Fără descriere.')+'</p></article>'+subtasks+reminderPanel+'<div class="actions">'+(isNote?btn('pin',item.pinned?'Anulează fixarea':'Fixează')+btn('convert','Transformă în sarcină','','task')+btn('convert','Transformă în eveniment','','event'):item.type==='task'?btn('toggle',item.done?'Debifează':'Finalizează','accent',item.id):'')+btn('delete-request','Șterge','danger')+'</div>'+(confirmDelete?'<div class="panel" style="margin-top:12px"><p>Ștergi această înregistrare?</p><div class="actions">'+btn('delete','Confirmă ștergerea','danger')+btn('delete-cancel','Anulează')+'</div></div>':'')+'</div>';
}
function sharing(item){
  return '<div class="detail">'+round('back','back','Înapoi')+'<h1>Partajare</h1><p class="muted">'+esc(item.title)+' · Acces demonstrativ</p><form class="panel formgrid" id="invite" style="margin-top:16px">'+field('Adresă de e-mail','email','','email','required')+select('Permisiune','role',roles,'view')+'<div><button class="accent">Adaugă invitație demo</button></div></form>'+section('Persoane cu acces',stack(item.people.map((person,i)=>'<div class="lineitem"><strong style="overflow-wrap:anywhere">'+esc(person.email)+'</strong><div class="actions"><select aria-label="Permisiune pentru '+esc(person.email)+'" data-person="'+i+'">'+options(roles,person.role)+'</select>'+btn('revoke','Revocă','danger',String(i))+'</div></div>'),'Înregistrare privată.'))+'</div>';
}
function render(scroll=false){
  applyTheme();
  renderChrome();
  renderReminder();
  const record=get(chosen);
  const pages={home,note:notesPage,task:tasksPage,event:calendarPage,settings};
  app.innerHTML=screen==='form'?formPage():screen==='detail'&&record?detailPage(record):screen==='share'&&record?sharing(record):pages[page]();
  window.mountMyDayBackup?.();
  if(scroll) window.scrollTo(0,0);
}
function go(tab){
  if(tab!==page) overdueOnly=false;
  page=data.tab=tab;screen='';chosen='';confirmDelete=false;save();
}
function editRecord(item,type=item.type){
  chosen=get(item.id)?item.id:'';
  draft=structuredClone(item);
  draft.type=type;
  if(type==='event') {
    draft.date ||= page==='event'?selected:today();
    draft.start ||= '09:00';
    draft.end ||= '10:00';
  }
  screen='form';
}
function readDraft(){
  const form=el('record'), values=new FormData(form);
  for(const field of ['title','body','category','color','date','time','start','end','priority','repeat']){
    if(values.has(field)) draft[field]=values.get(field).trim();
  }
  if(values.has('sub')){
    const previous=[...draft.sub];
    draft.sub=values.get('sub').split('\n').map(s=>s.trim()).filter(Boolean).map(title=>{
      const index=previous.findIndex(s=>s.title===title);
      return index<0?{title,done:false}:previous.splice(index,1)[0];
    });
  }
  if(draft.type!=='note') for(const key of Object.keys(offsets)){
    const previous=draft.reminders[key];
    if(values.has('reminder-'+key)) draft.reminders[key]={...previous,enabled:true};
    else if(previous) draft.reminders[key]={...previous,enabled:false};
  }
  return draft;
}
function toggle(item){
  item.done=!item.done;
  if(item.done && item.date && item.repeat!=='none'){
    let nextDay=shifted(parse(item.date),1);
    while(!occurs(item,dateKey(nextDay))) nextDay=shifted(nextDay,1);
    const next=dateKey(nextDay);
    if(!item.nextId){
      const occurrence=make('task',item.title,item.body,{...structuredClone(item),id:crypto.randomUUID?.()??String(Date.now()+Math.random()),date:next,done:false,nextId:null,sub:item.sub.map(s=>({...s,done:false})),reminders:Object.fromEntries(Object.entries(item.reminders).map(([key,r])=>[key,{enabled:r.enabled}]))});
      item.nextId=occurrence.id;
      data.items.push(occurrence);
    }
  }
  save();
}
document.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');
  if(!button) return;
  const {action,id}=button.dataset, item=get(chosen);
  let scroll=false;
  switch(action){
    case 'nav': go(id); overdueOnly=false; if(id==='task') taskFilter='all'; scroll=true;break;
    case 'overdue':go('task');overdueOnly=true;scroll=true;break;
    case 'theme-cycle':data.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();break;
    case 'theme':data.theme=id;save();break;
    case 'filter':filter=id;break;
    case 'task-filter':overdueOnly=id==='late';taskFilter=id;break;
    case 'scope':scope=id;break;
    case 'day':selected=id;break;
    case 'shift': {
      const d=parse(selected), step=Number(id);
      if(scope==='month'){
        const last=new Date(d.getFullYear(),d.getMonth()+step+1,0).getDate();
        selected=dateKey(new Date(d.getFullYear(),d.getMonth()+step,Math.min(d.getDate(),last),12));
      }else selected=dateKey(shifted(d,step*(scope==='week'?7:1)));
      break;
    }
    case 'add':
    case 'add-event': {
      const type=action==='add-event'||page==='event'?'event':page==='task'?'task':'note';
      editRecord(make(type,'',''));scroll=true;break;
    }
    case 'edit':editRecord(get(id));scroll=true;break;
    case 'type': {
      readDraft();
      draft.type=id;
      if(id==='event'){draft.date ||= page==='event'?selected:today();draft.start ||= '09:00';draft.end ||= '10:00';}
      break;
    }
    case 'convert':editRecord(item,id);scroll=true;break;
    case 'detail':chosen=id;screen='detail';confirmDelete=false;scroll=true;break;
    case 'share':chosen=id;screen='share';scroll=true;break;
    case 'back':screen=screen==='form'&&item||screen==='share'&&page!=='settings'?'detail':'';confirmDelete=false;scroll=true;break;
    case 'toggle':toggle(get(id));break;
    case 'pin':item.pinned=!item.pinned;save();break;
    case 'delete-request':confirmDelete=true;break;
    case 'delete-cancel':confirmDelete=false;break;
    case 'delete':
      lastDeleted={item,index:data.items.indexOf(item)};
      data.items=data.items.filter(i=>i.id!==chosen);
      screen='';chosen='';confirmDelete=false;
      save();notice('Înregistrare ștearsă',true);break;
    case 'undo-delete':
      if(!lastDeleted)return;
      data.items.splice(lastDeleted.index,0,lastDeleted.item);
      lastDeleted=null;save();notice('Înregistrare restaurată');break;
    case 'reminder-toggle':item.reminders[id].enabled=!item.reminders[id].enabled;save();break;
    case 'snooze': {
      const reminder=item.reminders[id], due=dueReminder();
      const snooze=Date.now()+600000;
      const date=due?.item===item&&due.key===id?due.date:item.date;
      reminder.snooze=snooze;
      reminder.occurrence=date;
      delete reminder.dismissed;
      save();notice('Reminder amânat 10 minute');break;
    }
    case 'banner-snooze':
    case 'banner-dismiss': {
      const due=dueReminder();
      if(!due)return;
      const reminder=due.item.reminders[due.key];
      reminder.occurrence=due.date;
      if(action==='banner-dismiss')reminder.dismissed=due.date;
      else reminder.snooze=Date.now()+600000;
      save();renderReminder();return;
    }
    case 'revoke':item.people.splice(Number(id),1);save();notice('Acces demonstrativ revocat');break;
    default:return;
  }
  render(scroll);
  if(action==='delete-request') app.querySelector('[data-action="delete-cancel"]').focus();
  if(action==='toggle') [...app.querySelectorAll('[data-action="toggle"]')].find(b=>b.dataset.id===id)?.focus({preventScroll:true});
});
document.addEventListener('change',event=>{
  const input=event.target, item=get(chosen);
  if(input.id==='notifications'){data.notifications=input.checked;save();renderReminder();}
  if(input.hasAttribute('data-sub')){item.sub[Number(input.dataset.sub)].done=input.checked;save();}
  if(input.hasAttribute('data-person')){item.people[Number(input.dataset.person)].role=input.value;save();notice('Permisiune actualizată');}
});
document.addEventListener('submit',event=>{
  event.preventDefault();
  const values=new FormData(event.target), item=get(chosen);
  if(event.target.id==='record'){
    const entry=readDraft(), error=el('form-error');
    if(!entry.title){error.textContent='Introdu un titlu.';return;}
    if(entry.type==='event'&&entry.end<=entry.start){error.textContent='Ora de sfârșit trebuie să fie după început.';return;}
    if(entry.type==='task'&&!entry.date&&(entry.repeat!=='none'||Object.values(entry.reminders).some(r=>r.enabled))){error.textContent='Alege un termen pentru repetare sau remindere.';return;}
    if(entry.type==='task'&&!entry.time&&Object.values(entry.reminders).some(r=>r.enabled)){error.textContent='Alege ora termenului pentru remindere.';return;}
    if(entry.type!=='note')entry.pinned=false;
    if(item){data.items[data.items.indexOf(item)]=entry;screen='detail';}
    else{
      data.items.unshift(entry);
      if(page==='event'&&entry.type==='event') selected=entry.date;
      if(page==='note'&&entry.type==='note') filter='all';
      if(page==='task'&&entry.type==='task'){overdueOnly=false;taskFilter='all';}
      chosen=entry.id;screen='detail';
    }
    save();render(true);notice('Înregistrare salvată');
  } else if(event.target.id==='profile'){
    const name=values.get('name').trim();
    if(!name)return;
    data.name=name;save();render();notice('Nume salvat');
  } else if(event.target.id==='invite'){
    const email=values.get('email').trim().toLowerCase(),role=values.get('role');
    const existing=item.people.find(p=>p.email===email);
    if(existing)existing.role=role;
    else item.people.push({email,role});
    save();render();notice('Acces demonstrativ salvat');
  }
});
render();
setInterval(renderReminder,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderReminder();});
</script>
<!--
Plan pentru producție
- Supabase Auth și RLS: proprietarul scrie înregistrările și acordă sau revocă accesul. Politicile separă citirea de editare. Invitațiile expiră și se acceptă prin cont verificat.
- Date: înregistrări, colaboratori, remindere, apariții recurente, abonamente push pe dispozitiv. Persistă fusul orar IANA și momentul UTC, recalculează la editare și la schimbări DST.
- Coada server: job unic per apariție și decalaj. Un worker revendică atomic joburile scadente, reverifică permisiunile, preferințele și versiunile înregistrărilor, trimite Web Push cu VAPID, reîncearcă temporar și elimină abonamentele expirate. Amânarea programează un job nou. Titlurile din push sunt opționale.
- PWA: manifest și service worker. Permisiunea pornește dintr-o acțiune explicită. Service worker afișează notificarea și deschide înregistrarea autorizată. Verifică pe iPhone instalat pe ecranul principal și pe Android în browser compatibil, inclusiv cu aplicația închisă.
- Client: înlocuiește adaptorul local cu sincronizare autentificată și folosește ID-uri stabile pentru migrare, sincronizare și rezolvarea editărilor concurente.
-->
